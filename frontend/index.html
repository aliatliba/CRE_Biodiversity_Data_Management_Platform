<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#053B06"
    />

    <meta
      name="description"
      content="BioData — the field biodiversity registry. Log sites, validate species against global taxonomy databases, and keep every survey record in one place."
    />

    <link
      rel="preload"
      as="image"
      href="/assests/landing/National_Emblem_of_Algeria_(bronze_effect).svg.webp"
    />

    <link
      rel="preload"
      as="image"
      href="/assests/landing/CRE%20LOGO.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>BioData</title>

    <!-- Prevent light-mode flash before the page paints -->
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;

        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: #052707;

        opacity: 1;

        transition:
          opacity 1.6s ease-in-out,
          visibility 1.6s ease-in-out;
      }

      #initial-splash::before {
        content: "";

        position: absolute;
        inset: 0;

        background:
          radial-gradient(
            circle at center,
            rgba(158, 240, 26, 0.10) 0%,
            rgba(5, 59, 6, 0.25) 35%,
            rgba(5, 39, 7, 0.96) 100%
          );

        pointer-events: none;
      }

      .initial-splash-glow {
        position: absolute;

        width: min(60vw, 650px);
        height: min(60vw, 650px);

        border-radius: 50%;

        background: rgba(158, 240, 26, 0.07);

        filter: blur(90px);

        pointer-events: none;
      }

      .initial-splash-image {
        position: absolute;
        z-index: 2;

        display: block;

        object-fit: contain;

        pointer-events: none;
      }

      /* Algerian emblem */
      .initial-splash-emblem {
        width: min(48vw, 520px);
        height: min(48vw, 520px);

        opacity: 0;

        animation:
          splash-emblem-in 1.2s ease-in-out 0s forwards,
          splash-emblem-out 1.6s ease-in-out 2.6s forwards;
      }

      /* CRE logo */
      .initial-splash-cre-logo {
          width: min(67vw, 736px);
          height: min(67vw, 736px);

        opacity: 0;

        animation:
          splash-cre-in 1.2s ease-in-out 4.2s forwards,
          splash-cre-out 1.6s ease-in-out 6.8s forwards;
      }

      @keyframes splash-emblem-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes splash-emblem-out {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      @keyframes splash-cre-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes splash-cre-out {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      #initial-splash.initial-splash-exit {
        opacity: 0;
        visibility: hidden;
      }

      @media (max-width: 640px) {
        .initial-splash-emblem {
          width: min(72vw, 360px);
          height: min(72vw, 360px);
        }

        .initial-splash-cre-logo {
          width: min(65vw, 320px);
          height: min(65vw, 320px);
        }

        .initial-splash-glow {
          width: 80vw;
          height: 80vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-splash {
          transition: none;
        }

        .initial-splash-emblem,
        .initial-splash-cre-logo {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- This is visible immediately, before React/Vite loads -->
    <div id="initial-splash">
      <div class="initial-splash-glow"></div>

      <img
        src="/assests/landing/National_Emblem_of_Algeria_(bronze_effect).svg.webp"
        alt=""
        class="initial-splash-image initial-splash-emblem"
      />

      <img
        src="/assests/landing/CRE%20LOGO.png"
        alt=""
        class="initial-splash-image initial-splash-cre-logo"
      />
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
