services:
  db:
    image: postgres:16
    container_name: biodiversity_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Exposed to host for local dev only.
      # In production, remove this and let only the "api" service reach the db
      # over the internal Docker network.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume: this is where Postgres actually stores your data.
      # It survives container restarts/removal (until you explicitly delete it).
      - pgdata:/var/lib/postgresql/data
      # Init scripts: Postgres runs every .sql/.sh file in this folder,
      # in alphabetical order, but ONLY the very first time the volume is created.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biodiversity_api
    restart: unless-stopped
    env_file:
      - .env
    environment: 
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy    

        
volumes:
  pgdata: