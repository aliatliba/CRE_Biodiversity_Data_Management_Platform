

services:
  db:
    image: postgres:17

    container_name: biodiversity_postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biodata"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - biodiversity_network

volumes:
  postgres_data:

networks:
  biodiversity_network:
    driver: bridge