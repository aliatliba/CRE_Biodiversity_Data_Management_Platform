version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biodiversity
      POSTGRES_PASSWORD: biodiversity
      POSTGRES_DB: biodiversity_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biodiversity -d biodiversity_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biodiversity_network

  api:
    build: ./backend
    volumes:
      - ./data:/data

    environment:
      DATABASE_URL: postgresql+psycopg2://biodiversity:biodiversity@db:5432/biodiversity_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: HS256
      IUCN_API_TOKEN: ${IUCN_API_TOKEN:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - biodiversity_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - biodiversity_network

  migrations:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://biodiversity:biodiversity@db:5432/biodiversity_db
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head"
    networks:
      - biodiversity_network
    profiles:
      - migrations
  

volumes:
  postgres_data:

networks:
  biodiversity_network:
    driver: bridge
