[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodiversity-platform-backend"
version = "1.0.0"
description = "Biodiversity Data Entry Platform Backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
# Applied migrations are never edited, so they are not reformatted either.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Long lines are mostly strings/SQL/UI copy; keep the check for real bugs only.
ignore = ["E501"]
